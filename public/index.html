<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ミラーコピーアプリ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🪞 ミラーコピーアプリ</h1>
    <p class="sub">送信元フォルダの変更をリアルタイムで監視し、コピー先へミラー転送します。</p>
  </header>

  <main>
    <section class="card">
      <h2>新しいミラー転送を追加</h2>
      <form id="job-form">
        <label>
          名前（任意）
          <input type="text" name="name" placeholder="例: 写真バックアップ" />
        </label>
        <label>
          送信元フォルダ
          <div class="path-row">
            <input type="text" name="source" placeholder="「参照」から選択してください" readonly required />
            <button type="button" class="secondary" data-browse="source">参照…</button>
          </div>
        </label>
        <label>
          コピー先フォルダ
          <div class="path-row">
            <input type="text" name="dest" placeholder="「参照」から選択してください" readonly required />
            <button type="button" class="secondary" data-browse="dest">参照…</button>
          </div>
        </label>
        <label class="checkbox">
          <input type="checkbox" name="deleteOrphans" checked />
          送信元で削除されたファイルをコピー先からも削除する（完全ミラー）
        </label>
        <button type="submit">追加</button>
      </form>
      <p id="form-error" class="error"></p>
    </section>

    <section>
      <h2>ミラー転送ジョブ</h2>
      <div id="jobs"></div>
    </section>
  </main>

  <!-- フォルダ選択ダイアログ -->
  <div id="picker" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="picker-title">フォルダを選択</h3>
        <button type="button" class="icon" id="picker-close">✕</button>
      </div>
      <div class="picker-bar">
        <button type="button" class="secondary" id="picker-up">⬆ 上の階層へ</button>
        <button type="button" class="secondary" id="picker-home">🏠 ホーム</button>
        <code id="picker-path"></code>
      </div>
      <ul id="picker-list" class="picker-list"></ul>
      <div class="modal-foot">
        <button type="button" class="secondary" id="picker-newfolder">＋ 新規フォルダ</button>
        <div class="spacer"></div>
        <button type="button" class="secondary" id="picker-cancel">キャンセル</button>
        <button type="button" id="picker-select">このフォルダを選択</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
